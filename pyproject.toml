[project]
name = "opf-advisor"
version = "0.1.0"
description = "Веб-сервис подбора организационно-правовой формы (ИП, ООО, АО, самозанятость)"
readme = "README.md"
authors = [
    { name = "groknut", email = "groknut.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "fpdf2>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"